name: Test and deploy Otium Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'XRTM8/Otium-Lab'
    name: Build Otium Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Lab isolation and build identity
        run: npm run lab:check

      - name: Run automated regression suite
        run: npm test -- --reporter=dot

      - name: Test media engines
        run: npm run lab:media:test

      - name: Check application source
        run: npm run lint

      - name: Audit dependency advisories
        run: npm audit --audit-level=high

      - name: Build Web Application
        run: |
          npm run prebuild
          npx tsc -b
          npx vite build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  rust:
    if: github.repository == 'XRTM8/Otium-Lab'
    name: Verify Rust Core & Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Workspace
        uses: Swatinem/rust-cache@v2

      - name: Clippy Pure Rust Crates
        run: >
          cargo clippy --locked
          -p otium-core -p otium-slides -p otium-scanner -p otium-ink
          -p otium-pdf -p otium-vault -p otium-beam -p otium-wasm
          --all-targets -- -D warnings

      - name: Run Rust Unit Tests
        run: >
          cargo test --locked
          -p otium-core -p otium-slides -p otium-scanner -p otium-ink
          -p otium-pdf -p otium-vault -p otium-beam -p otium-wasm

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, rust]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

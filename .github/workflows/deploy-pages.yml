name: Test and deploy Otium Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'XRTM8/Otium-Lab'
    name: Build Otium Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Lab isolation and build identity
        run: npm run lab:check

      - name: Verify single-version alignment
        run: npm run version:check

      - name: Run automated regression suite and enforce coverage
        run: npm run test:coverage -- --reporter=dot

      - name: Test media engines
        run: npm run lab:media:test

      - name: Check application source
        run: npm run lint

      - name: Audit dependency advisories
        run: npm audit --audit-level=high

      - name: Build Media Lab & Web Application
        run: |
          npm run lab:media:build
          npm run prebuild
          npx tsc -b --force --pretty false
          npx vite build

      - name: Verify Real Headless Browser E2E Suite
        run: npm run e2e:verify

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  rust:
    if: github.repository == 'XRTM8/Otium-Lab'
    name: Verify Rust Core & Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Workspace
        uses: Swatinem/rust-cache@v2

      - name: Clippy Pure Rust Crates
        run: >
          cargo clippy --locked
          -p otium-core -p otium-slides -p otium-scanner -p otium-ink
          -p otium-pdf -p otium-vault -p otium-beam -p otium-wasm -p otium-scan-math
          --all-targets -- -D warnings

      - name: Clippy and Build Rust WASM Target
        run: |
          cargo clippy --locked -p otium-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo build --locked --release -p otium-wasm --target wasm32-unknown-unknown

      - name: Run Rust Unit Tests
        run: >
          cargo test --locked
          -p otium-core -p otium-slides -p otium-scanner -p otium-ink
          -p otium-pdf -p otium-vault -p otium-beam -p otium-wasm -p otium-scan-math

  tauri-windows:
    if: github.repository == 'XRTM8/Otium-Lab'
    name: Verify Tauri Host (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Workspace
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-tauri-host

      - name: Prepare Frontend Dist Stub
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Clippy and Test Tauri Host Library
        run: |
          cargo clippy --locked -p otium --lib --all-targets -- -D warnings
          cargo test --locked -p otium --lib

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, rust, tauri-windows]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

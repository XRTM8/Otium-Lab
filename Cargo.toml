[workspace]
resolver = "2"
members = [
    "crates/otium-core",
    "crates/otium-bridge",
]

[workspace.package]
version = "3.3.1"
edition = "2021"
authors = ["XRTM8"]
license = "GPL-3.0"

[workspace.dependencies]
thiserror = "2.0"

# Internal workspace crates
otium-core = { path = "crates/otium-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

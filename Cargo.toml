[workspace]
resolver = "2"
members = [
    "crates/otium-core",
    "crates/otium-scanner",
    "crates/otium-scan-math",
    "crates/otium-vault",
    "crates/otium-bridge",
]

[workspace.package]
version = "2.1.1"
edition = "2021"
authors = ["XRTM8"]
license = "GPL-3.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
redb = "2.3"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
log = "0.4"

# Internal workspace crates
otium-core = { path = "crates/otium-core" }
otium-vault = { path = "crates/otium-vault" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
